name: Wiki
run-name: Wiki ${{ github.run_number }}

# Publishes the pages in wiki/ to the GitHub wiki whenever they change.
on:
  push:
    branches: [ main ]
    paths: [ 'wiki/**' ]
  workflow_dispatch:
    inputs:
      screenshots:
        description: 'Capture screenshots of the latest release on an emulator'
        type: boolean
        default: false
      patch:
        description: 'Optional gzip+base64 diff to build and capture instead of the release'
        type: string
        default: ''
      retag:
        description: 'Move a tag: name=commit'
        type: string
        default: ''

permissions:
  contents: write

jobs:
  retag:
    if: ${{ inputs.retag != '' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move the tag
        env:
          RETAG: ${{ inputs.retag }}
        run: |
          name="${RETAG%%=*}"; sha="${RETAG#*=}"
          git cat-file -e "$sha^{commit}"
          git push --force origin "$sha:refs/tags/$name"
          git ls-remote origin "refs/tags/$name"

  publish:
    if: ${{ !inputs.screenshots && inputs.retag == '' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Publish wiki
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki-repo
          rsync -a --delete --exclude .git wiki/ wiki-repo/
          cd wiki-repo
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki is up to date"
            exit 0
          fi
          git commit -m "Update wiki"
          git push

  screenshots:
    if: ${{ inputs.screenshots }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        if: ${{ inputs.patch != '' }}
      - uses: actions/setup-java@v6
        if: ${{ inputs.patch != '' }}
        with:
          distribution: 'zulu'
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        if: ${{ inputs.patch != '' }}
      - name: Build the patched app
        if: ${{ inputs.patch != '' }}
        env:
          PATCH: ${{ inputs.patch }}
          KEYSTORE: ${{ secrets.KEYSTORE }}
        run: |
          mkdir -p shots
          echo "$PATCH" | base64 -d | gunzip > /tmp/change.diff
          git apply --whitespace=nowarn /tmp/change.diff 2>&1 | tee shots/build.log
          echo storePassword='${{ secrets.KEYSTORE_PASSWORD }}' >> keystore.properties
          echo keyAlias='${{ secrets.KEY_ALIAS }}' >> keystore.properties
          echo keyPassword='${{ secrets.KEY_PASSWORD }}' >> keystore.properties
          echo storeFile='${{ github.workspace }}/key.jks' >> keystore.properties
          echo "$KEYSTORE" | base64 --decode > key.jks
          set +e
          ./gradlew assembleOssWithQuickstepGithubRelease --console=plain >> shots/build.log 2>&1
          rc=$?
          set -e
          grep -E '^e: |error:|What went wrong' -A3 shots/build.log > shots/errors.txt || true
          if [ "$rc" -ne 0 ]; then tail -80 shots/build.log; exit 1; fi
          cp "$(find build/outputs/apk -name '*.apk' | head -1)" TheLauncher.apk
          rm -f key.jks keystore.properties
      - name: Download latest release
        if: ${{ inputs.patch == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R "$GITHUB_REPOSITORY" -p 'TheLauncher-v*.apk' -O TheLauncher.apk
          ls -la TheLauncher.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start a stand-in Seerr server
        if: ${{ inputs.patch != '' }}
        run: |
          cat > "$RUNNER_TEMP/seerr.py" <<'PY'
          import json, re
          from http.server import BaseHTTPRequestHandler, HTTPServer

          def movie(tmdb, title, date, poster, status=None, overview=""):
              item = {"id": tmdb, "mediaType": "movie", "title": title, "releaseDate": date,
                      "posterPath": poster, "overview": overview, "voteAverage": 7.4}
              if status:
                  item["mediaInfo"] = {"id": tmdb, "tmdbId": tmdb, "status": status}
              return item

          RESULTS = [
              movie(414906, "The Batman", "2022-03-01", "/74xTEgt7R36Fpooo50r9T25onhq.jpg", 5,
                    "In his second year of fighting crime, Batman uncovers corruption in Gotham City."),
              movie(268, "Batman", "1989-06-21", "/cij4dd21v2Rk2YtUQbV5kW69WB2.jpg", None,
                    "Batman must face his most ruthless nemesis when a deformed madman calling himself the Joker seizes control of Gotham's criminal underworld."),
              {"id": 2098, "mediaType": "tv", "name": "Batman: The Animated Series", "firstAirDate": "1992-09-05",
               "posterPath": "/lBomQFW1vlm1yUYMNSbFZ45R4Ox.jpg", "voteAverage": 8.5,
               "overview": "The Dark Knight battles crime in Gotham City with occasional help from Robin and Batgirl."},
              movie(272, "Batman Begins", "2005-06-10", "/4MpN4kIEqUjW8OPtOQJXlTdHiJV.jpg", 3,
                    "Driven by tragedy, billionaire Bruce Wayne dedicates his life to uncovering and defeating the corruption that plagues his home."),
              movie(364, "Batman Returns", "1992-06-19", "/jKBjeXM7iBBV9UkUcOXx3m7FSHY.jpg", 5,
                    "The Penguin rises from the sewers to take over Gotham City."),
              movie(415, "Batman & Robin", "1997-06-20", None),
              movie(155, "The Dark Knight", "2008-07-16", None),
          ]

          class Handler(BaseHTTPRequestHandler):
              def reply(self, code, body=None):
                  data = json.dumps(body if body is not None else {}).encode()
                  self.send_response(code)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(data)))
                  self.end_headers()
                  self.wfile.write(data)

              def do_GET(self):
                  path = self.path.split("?")[0]
                  if path == "/api/v1/status":
                      return self.reply(200, {"version": "2.7.3"})
                  if path == "/api/v1/auth/me":
                      return self.reply(200, {"id": 1, "displayName": "Admin"})
                  if path == "/api/v1/search":
                      return self.reply(200, {"page": 1, "totalPages": 1, "totalResults": len(RESULTS), "results": RESULTS})
                  m = re.fullmatch(r"/api/v1/(movie|tv)/(\d+)", path)
                  if m:
                      item = next((r for r in RESULTS if r["id"] == int(m.group(2))), None)
                      if item is None:
                          return self.reply(404, {"message": "Not found"})
                      details = dict(item)
                      if m.group(1) == "movie":
                          details["runtime"] = 126
                      else:
                          details["numberOfSeasons"] = 3
                          details["status"] = "Ended"
                          details["seasons"] = [{"seasonNumber": n, "name": "Season %d" % n, "episodeCount": c}
                                                for n, c in ((1, 65), (2, 20), (3, 0))]
                      info = details.get("mediaInfo")
                      if info:
                          info = dict(info)
                          info["requests"] = [{"id": item["id"] * 10, "is4k": False, "status": 2}]
                          if info["status"] == 5:
                              info["serviceId"] = 0
                              info["externalServiceId"] = 7
                          details["mediaInfo"] = info
                      return self.reply(200, details)
                  self.reply(404, {"message": "Not found"})

              def do_POST(self):
                  self.reply(201, {"id": 99, "status": 2})

              def do_DELETE(self):
                  self.reply(204)

          HTTPServer(("0.0.0.0", 5055), Handler).serve_forever()
          PY
          nohup python3 "$RUNNER_TEMP/seerr.py" > "$RUNNER_TEMP/seerr.log" 2>&1 &
          sleep 2
          curl -s localhost:5055/api/v1/status
      - name: Write capture script
        run: |
          cat > "$RUNNER_TEMP/shots.sh" <<'SCRIPT'
          #!/bin/bash
          set -x
          PKG=app.thelauncher
          PREFS="$PKG/app.thelauncher.ui.preferences.PreferenceActivity"
          OUT="$GITHUB_WORKSPACE/shots"
          mkdir -p "$OUT"

          dump() { adb shell uiautomator dump /sdcard/ui.xml >/dev/null 2>&1 && adb pull /sdcard/ui.xml "$1" >/dev/null 2>&1; }
          shot() { sleep "${2:-3}"; adb exec-out screencap -p > "$OUT/$1.png"; dump "$OUT/$1.xml"; }
          find_xy() {
            dump /tmp/ui.xml || return 1
            python3 - "$1" <<'PY'
          import re, sys, xml.etree.ElementTree as ET
          pat = re.compile(sys.argv[1], re.I)
          try:
              root = ET.parse('/tmp/ui.xml').getroot()
          except Exception:
              sys.exit(1)
          for n in root.iter('node'):
              for k in ('text', 'content-desc'):
                  v = n.get(k) or ''
                  if v and pat.fullmatch(v):
                      b = list(map(int, re.findall(r'\d+', n.get('bounds'))))
                      print((b[0] + b[2]) // 2, (b[1] + b[3]) // 2)
                      sys.exit(0)
          sys.exit(1)
          PY
          }
          scroll_to() { for i in 1 2 3 4 5 6 7 8; do find_xy "$1" >/dev/null && return 0; scroll; done; return 1; }
          tap_text() { xy=$(find_xy "$1") && { adb shell input tap $xy; sleep 2; return 0; }; echo "tap_text: '$1' not found"; return 1; }
          tap_last() {
            dump /tmp/ui.xml || return 1
            xy=$(python3 - "$1" <<'PY'
          import re, sys, xml.etree.ElementTree as ET
          pat = re.compile(sys.argv[1], re.I)
          found = None
          for n in ET.parse('/tmp/ui.xml').getroot().iter('node'):
              for k in ('text', 'content-desc'):
                  v = n.get(k) or ''
                  if v and pat.fullmatch(v):
                      b = list(map(int, re.findall(r'\d+', n.get('bounds'))))
                      found = ((b[0] + b[2]) // 2, (b[1] + b[3]) // 2)
          if not found:
              sys.exit(1)
          print(*found)
          PY
            ) && { adb shell input tap $xy; sleep 2; return 0; }; echo "tap_last: '$1' not found"; return 1
          }
          tap_field() {
            dump /tmp/ui.xml || return 1
            xy=$(python3 - <<'PY'
          import re, sys, xml.etree.ElementTree as ET
          for n in ET.parse('/tmp/ui.xml').getroot().iter('node'):
              if 'EditText' in (n.get('class') or ''):
                  b = list(map(int, re.findall(r'\d+', n.get('bounds'))))
                  print((b[0] + b[2]) // 2, (b[1] + b[3]) // 2)
                  sys.exit(0)
          sys.exit(1)
          PY
            ) && { adb shell input tap $xy; sleep 1; return 0; }; return 1
          }
          type_setting() { scroll_to "$1" && tap_text "$1" && tap_field && adb shell input text "$2" && sleep 1 && tap_last 'OK'; }
          long_text() { xy=$(find_xy "$1") && { set -- $xy; adb shell input swipe $1 $2 $1 $2 1200; sleep 2; return 0; }; echo "long_text: not found"; return 1; }
          long_xy() { adb shell input swipe $1 $2 $1 $2 1200; sleep 2; }
          home() { adb shell input keyevent KEYCODE_HOME; sleep 2; }
          back() { adb shell input keyevent KEYCODE_BACK; sleep 1; }
          scroll() { adb shell input swipe 540 1900 540 700 500; sleep 2; }
          nudge() { adb shell input swipe 540 1600 540 1000 500; sleep 2; }
          drawer() { home; long_xy 540 1200; tap_text 'Apps list'; sleep 3; }
          dismiss() { sleep 4; tap_text 'Cancel' || true; }
          settings() {
            if [ -n "$1" ]; then
              adb shell am start -W --activity-clear-task -n "$PREFS" -a android.intent.action.VIEW -d "thelauncher://settings/$1" >/dev/null
            else
              adb shell am start -W --activity-clear-task -n "$PREFS" >/dev/null
            fi
            sleep 3
          }

          # Device setup: dark theme, gesture navigation, clean status bar, on battery.
          adb install -r -g TheLauncher.apk
          adb shell cmd role add-role-holder android.app.role.HOME $PKG
          adb shell cmd overlay enable com.android.internal.systemui.navbar.gestural
          adb shell cmd uimode night yes
          adb emu geo fix -0.1276 51.5072
          adb emu power ac off
          adb emu power status discharging
          adb emu power capacity 82
          adb shell settings put global sysui_demo_allowed 1
          demo() { adb shell am broadcast -a com.android.systemui.demo -e command "$@" >/dev/null; }
          demo enter
          demo clock -e hhmm 0930
          demo battery -e level 82 -e plugged false
          demo network -e wifi show -e level 4
          demo network -e mobile show -e datatype none -e level 4
          demo notifications -e visible false
          home; sleep 8
          shot 00-home-first 2

          # At a Glance: Open-Meteo weather on, onboarding card off.
          settings smartspace
          dismiss
          shot 20-glance
          scroll_to 'Weather \(Open-Meteo, uses location\)' && tap_text 'Weather \(Open-Meteo, uses location\)'
          dismiss
          shot 21-glance-weather
          scroll_to 'Onboarding' && tap_text 'Onboarding'
          dismiss
          shot 22-glance-more
          back; back; back

          # Weather for the widget: a fixed place, since the emulator has no real location.
          settings smartspace
          dismiss
          type_setting 'Weather location' 'Dublin'
          back; back

          # Material At a Glance (builds that have it): settings, then the widget in a few states.
          settings smartspace
          dismiss
          if scroll_to 'Material card'; then
            nudge
            shot 24-glance-style
            scroll; shot 26-glance-style-more
            back; back
            home; sleep 8; shot 29-glance-widget
            adb emu power ac on
            adb emu power status charging
            adb emu power capacity 82
            home; sleep 6; shot 30-glance-charging
            adb emu power ac off
            adb emu power status discharging
            adb emu power capacity 12
            home; sleep 6; shot 31-glance-low-battery
            adb emu power capacity 82
            # An alarm 40 minutes from now, for a second row.
            now=$(adb shell date +%H:%M | tr -d '\r')
            total=$(( 10#${now%%:*} * 60 + 10#${now##*:} + 40 ))
            adb shell am start -a android.intent.action.SET_ALARM --ei android.intent.extra.alarm.HOUR $(( (total / 60) % 24 )) --ei android.intent.extra.alarm.MINUTES $(( total % 60 )) --ez android.intent.extra.alarm.SKIP_UI true >/dev/null
            sleep 3
            adb emu power ac on
            adb emu power status charging
            settings smartspace
            dismiss
            scroll_to 'Size' && tap_text 'Size' && tap_text 'Large: two rows'
            shot 32-glance-large-setting
            back; back
            home; sleep 8; shot 33-glance-large
            adb emu power ac off
            adb emu power status discharging
          else
            back; back
          fi

          # Seerr in search (builds that have it), against the stand-in server.
          settings seerr
          if find_xy 'Address' >/dev/null; then
            type_setting 'Address' 'http://10.0.2.2:5055'
            type_setting 'API key' 'stand-in-key'
            tap_text 'Test connection'; sleep 4
            shot 50-seerr-settings
            home; drawer
            adb shell input tap 540 230; sleep 2
            adb shell input text 'add%sbatman'; sleep 6
            back; sleep 1
            shot 51-seerr-add
            tap_text 'Batman: The Animated Series' && shot 52-seerr-info
            tap_last 'Add' && shot 53-seerr-seasons
            back; sleep 1
            tap_text 'Add' && sleep 3 && shot 54-seerr-added 1
            home; drawer
            adb shell input tap 540 230; sleep 2
            adb shell input text 'delete%sbatman'; sleep 6
            back; sleep 1
            shot 55-seerr-delete
            tap_text 'Delete' && sleep 3 && shot 56-seerr-delete-sheet
            back; home
          fi

          # Hyperion-style drawer (builds that have it): full screen instead of a sheet.
          settings app-drawer
          dismiss
          if scroll_to 'Drawer on a sheet'; then
            tap_text 'Drawer on a sheet'
            shot 27-drawer-setting
          fi
          back; back

          # Drawer indicator above the dock (builds that have it).
          settings dock
          dismiss
          if scroll_to 'Drawer indicator'; then
            nudge
            tap_text 'Drawer indicator'
            tap_text 'Arrow'
            shot 28-dock-indicator-setting
          fi
          back; back

          # Home screen.
          home; sleep 20
          shot 01-home
          long_xy 540 1200
          shot 02-home-menu
          back; home
          long_text '.*Chrome.*'
          shot 03-app-menu
          tap_text '(Customize|Edit)'
          shot 04-customize
          back; back; home
          tap_text '(Folder: )?Google'
          shot 05-folder
          back; home

          # Widgets.
          long_xy 540 1200
          tap_text 'Widgets'
          shot 06-widgets 4
          back; back; home

          # App drawer and search.
          drawer
          shot 07-drawer
          scroll
          shot 08-drawer-scrolled
          home; drawer
          adb shell input tap 540 230; sleep 2
          adb shell input text 'ca'
          shot 09-search 3
          back; back; home

          # Settings.
          settings
          shot 10-settings
          scroll
          shot 11-settings-more
          scroll
          shot 12-settings-end
          for p in general general-iconpack general-themedicons home-screen home-screen-grid home-screen-popup-editor \
                   dock dock-search-provider app-drawer app-drawer-hidden-apps app-drawer-locked-apps app-drawer-tabs \
                   app-drawer-folder search folders gestures smartspace backup-restore about experimental-features; do
            settings "$p"
            shot "s-$p"
            scroll
            shot "s-$p-2"
            scroll
            shot "s-$p-3"
          done
          settings general
          tap_text 'Icon shape'
          shot s-icon-shape
          settings gestures
          tap_text 'Double tap'
          shot s-gesture-picker
          home
          adb shell am broadcast -a com.android.systemui.demo -e command exit >/dev/null
          ls -la "$OUT"
          SCRIPT
          bash -n "$RUNNER_TEMP/shots.sh" && echo "script OK"
      - name: Capture
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: playstore
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash ${{ runner.temp }}/shots.sh
      - name: Store screenshots
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd shots
          git init -q
          git add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -q -m "Screenshots ${{ github.run_number }}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/screenshots/latest HEAD:refs/screenshots/run-${{ github.run_number }}
