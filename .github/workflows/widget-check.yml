name: Widget check
run-name: Widget check ${{ github.run_number }}

# Puts the launcher's own widgets on the home screen of an emulator, using the newest release, and
# keeps pictures and the log under refs/screenshots/widgets-N.
on:
  push:
    branches: [ main ]
    paths: [ '.github/screenshots/widgets.sh', '.github/workflows/widget-check.yml' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Newest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --pattern 'TheLauncher-v*.apk' --dir .
          mv TheLauncher-v*.apk TheLauncher.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator from the last build
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-playstore-pixel_6-v1
      - name: Place the widgets
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: playstore
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/screenshots/widgets.sh
      - name: Store the pictures
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -d shots ] || exit 0
          cd shots
          git init -q
          git add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -q -m "Widget check ${{ github.run_number }}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/screenshots/widgets-latest
