name: Release
run-name: Release ${{ github.event.inputs.tag || github.ref_name }}

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Use private signing key
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::Release signing secrets are not set (KEYSTORE, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD)"
            exit 1
          fi
          echo storePassword='${{ secrets.KEYSTORE_PASSWORD }}' >> keystore.properties
          echo keyAlias='${{ secrets.KEY_ALIAS }}' >> keystore.properties
          echo keyPassword='${{ secrets.KEY_PASSWORD }}' >> keystore.properties
          echo storeFile='${{ github.workspace }}/key.jks' >> keystore.properties
          echo "$KEYSTORE" | base64 --decode > key.jks
      - name: Build release APK
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: ./gradlew assembleOssWithQuickstepGithubRelease --stacktrace
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          APK=$(find build/outputs/apk -name '*.apk' | head -1)
          cp "$APK" "TheLauncher-$TAG.apk"
          sha256sum "TheLauncher-$TAG.apk" > SHA256SUMS.txt
          gh release create "$TAG" "TheLauncher-$TAG.apk" SHA256SUMS.txt --title "TheLauncher $TAG" \
            --target "${{ github.sha }}" --generate-notes
