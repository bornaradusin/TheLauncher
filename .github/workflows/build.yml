name: Build
run-name: Build ${{ github.run_number }}

on:
  push:
    branches: [ main ]
    paths-ignore: [ '**.md', 'LICENSE*', '.github/workflows/release.yml' ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::Signing secrets are not set (KEYSTORE, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD)"
            exit 1
          fi
          echo storePassword='${{ secrets.KEYSTORE_PASSWORD }}' >> keystore.properties
          echo keyAlias='${{ secrets.KEY_ALIAS }}' >> keystore.properties
          echo keyPassword='${{ secrets.KEY_PASSWORD }}' >> keystore.properties
          echo storeFile='${{ github.workspace }}/key.jks' >> keystore.properties
          echo "$KEYSTORE" | base64 --decode > key.jks
      - name: Build APK
        run: ./gradlew assembleOssWithQuickstepGithubRelease --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: TheLauncher
          path: build/outputs/apk/**/*.apk
