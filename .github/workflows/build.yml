name: Build
run-name: Build ${{ github.run_number }}

# Every push to main builds the signed app once. When version.txt names a version
# that has no release yet, the same build publishes it as a GitHub release.
# The same APK then goes on an emulator for screenshots (kept under refs/screenshots/);
# after a release they also refresh the wiki's pictures.
on:
  push:
    branches: [ main ]
    paths-ignore: [ '**.md', 'LICENSE*', 'wiki/**', '.github/workflows/wiki.yml' ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::Signing secrets are not set (KEYSTORE, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD)"
            exit 1
          fi
          echo storePassword='${{ secrets.KEYSTORE_PASSWORD }}' >> keystore.properties
          echo keyAlias='${{ secrets.KEY_ALIAS }}' >> keystore.properties
          echo keyPassword='${{ secrets.KEY_PASSWORD }}' >> keystore.properties
          echo storeFile='${{ github.workspace }}/key.jks' >> keystore.properties
          echo "$KEYSTORE" | base64 --decode > key.jks
      - name: Build APK
        run: ./gradlew assembleOssWithQuickstepGithubRelease --stacktrace
      - name: Prepare APK
        id: apk
        run: |
          VERSION=$(tr -d '[:space:]' < version.txt)
          APK=$(find build/outputs/apk -name '*.apk' | head -1)
          cp "$APK" "TheLauncher-v$VERSION.apk"
          sha256sum "TheLauncher-v$VERSION.apk" > SHA256SUMS.txt
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: TheLauncher
          path: |
            TheLauncher-v*.apk
            SHA256SUMS.txt
      - name: Publish release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.apk.outputs.version }}
        run: |
          rm -f key.jks keystore.properties
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "$TAG is already released"
            exit 0
          fi
          gh release create "$TAG" "TheLauncher-$TAG.apk" SHA256SUMS.txt --title "TheLauncher $TAG" \
            --target "${{ github.sha }}" --generate-notes
          echo "released=true" >> "$GITHUB_OUTPUT"

      # Screenshots of this same APK.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare the emulator run
        run: |
          cp "TheLauncher-v${{ steps.apk.outputs.version }}.apk" TheLauncher.apk
          nohup python3 .github/screenshots/seerr.py > "$RUNNER_TEMP/seerr.log" 2>&1 &
          python3 .github/screenshots/make_backup.py "$RUNNER_TEMP/hyperion_test.backup"
          sleep 2
          curl -s localhost:5055/api/v1/status
      - name: Capture screenshots
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: playstore
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/screenshots/capture.sh
      - name: Store screenshots
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -d shots ] || exit 0
          cd shots
          git init -q
          git add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -q -m "Screenshots ${{ github.run_number }}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/screenshots/latest HEAD:refs/screenshots/build-${{ github.run_number }}
      - name: Refresh the wiki pictures
        if: ${{ steps.release.outputs.released == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -d shots ] || exit 0
          grep -v '^#' .github/screenshots/wiki-images.txt | while read -r shot image; do
            [ -n "$shot" ] && [ -f "shots/$shot.png" ] && cp "shots/$shot.png" "wiki/images/$image"
          done
          git add wiki/images
          if git diff --cached --quiet; then echo "Wiki pictures unchanged"; exit 0; fi
          git -c user.name=bornaradusin -c user.email=43745159+bornaradusin@users.noreply.github.com \
            commit -q -m "Wiki: pictures from v${{ steps.apk.outputs.version }}"
          git pull -q --rebase origin main
          git push -q origin HEAD:main
          # A push made with this token doesn't start other workflows, so publish the wiki here.
          git clone -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" "$RUNNER_TEMP/wiki-repo"
          rsync -a --delete --exclude .git wiki/ "$RUNNER_TEMP/wiki-repo/"
          cd "$RUNNER_TEMP/wiki-repo"
          git add -A
          git diff --cached --quiet && exit 0
          git -c user.name=bornaradusin -c user.email=43745159+bornaradusin@users.noreply.github.com commit -q -m "Update wiki"
          git push -q
