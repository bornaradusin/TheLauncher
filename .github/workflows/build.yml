name: Build
run-name: Build ${{ github.run_number }}

# Every push to main builds the signed app once. When version.txt names a version
# that has no release yet, the same build publishes it as a GitHub release.
# A release then retakes only the wiki pictures its changes touch, on an emulator, with the same
# APK; other builds take no screenshots (a manual run can ask for them).
on:
  push:
    branches: [ main ]
    # Changes to the build itself or the screenshot scripts don't need a new APK.
    paths-ignore: [ '**.md', 'LICENSE*', 'wiki/**', '.github/workflows/**', '.github/screenshots/**' ]
  workflow_dispatch:
    inputs:
      screenshots:
        description: 'Screens to capture: empty for what changed, "all" for everything'
        type: string
        default: ''

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::Signing secrets are not set (KEYSTORE, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD)"
            exit 1
          fi
          echo storePassword='${{ secrets.KEYSTORE_PASSWORD }}' >> keystore.properties
          echo keyAlias='${{ secrets.KEY_ALIAS }}' >> keystore.properties
          echo keyPassword='${{ secrets.KEY_PASSWORD }}' >> keystore.properties
          echo storeFile='${{ github.workspace }}/key.jks' >> keystore.properties
          echo "$KEYSTORE" | base64 --decode > key.jks
      - name: Build APK
        run: ./gradlew assembleOssWithQuickstepGithubRelease --stacktrace
      # TheLauncher Feed: the small companion app that reaches the Google feed (see feedbridge/).
      - name: Build TheLauncher Feed
        run: ./gradlew -p feedbridge assembleDebug --stacktrace
      - name: Prepare APK
        id: apk
        run: |
          VERSION=$(tr -d '[:space:]' < version.txt)
          APK=$(find build/outputs/apk -name '*.apk' | head -1)
          cp "$APK" "TheLauncher-v$VERSION.apk"
          cp "$(find feedbridge/build/outputs/apk -name '*.apk' | head -1)" TheLauncher-Feed.apk
          sha256sum "TheLauncher-v$VERSION.apk" TheLauncher-Feed.apk > SHA256SUMS.txt
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: TheLauncher
          path: |
            TheLauncher-v*.apk
            TheLauncher-Feed.apk
            SHA256SUMS.txt
      - name: Publish release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.apk.outputs.version }}
        run: |
          rm -f key.jks keystore.properties
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "$TAG is already released"
            exit 0
          fi
          # Written notes for this version, if there are any; otherwise GitHub's list of changes.
          NOTES=(--generate-notes)
          [ -f ".github/release-notes/$TAG.md" ] && NOTES=(--notes-file ".github/release-notes/$TAG.md")
          gh release create "$TAG" "TheLauncher-$TAG.apk" TheLauncher-Feed.apk SHA256SUMS.txt --title "TheLauncher $TAG" \
            --target "${{ github.sha }}" "${NOTES[@]}"
          echo "released=true" >> "$GITHUB_OUTPUT"

      # Screenshots of this same APK.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare the emulator run
        env:
          GH_TOKEN: ${{ github.token }}
          ASKED: ${{ inputs.screenshots }}
          BEFORE: ${{ github.event.before }}
          RELEASED: ${{ steps.release.outputs.released }}
        run: |
          # Screenshots only when asked for by hand, and only of the screens asked for.
          if [ -n "$ASKED" ]; then
            echo "$ASKED" | tr ' ' '\n' > changed.txt
          else
            # No screenshots unless asked for by hand (Run workflow → screenshots).
            printf 'SECTIONS=none\nPAGES=none\n' | tee -a "$GITHUB_ENV"
            exit 0
          fi
          python3 .github/screenshots/sections.py ${RELEASED:+--release} < changed.txt | tee -a "$GITHUB_ENV"
          cp "TheLauncher-v${{ steps.apk.outputs.version }}.apk" TheLauncher.apk
          nohup python3 .github/screenshots/seerr.py > "$RUNNER_TEMP/seerr.log" 2>&1 &
          python3 .github/screenshots/make_backup.py "$RUNNER_TEMP/hyperion_test.backup"
          sleep 2
          curl -s localhost:5055/api/v1/status
      # A started emulator is kept between builds, so it resumes in seconds instead of booting
      # from scratch (several minutes) every time.
      - name: Emulator from the last build
        if: ${{ env.SECTIONS != 'none' || env.PAGES != 'none' }}
        id: avd-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-playstore-pixel_6-v1
      - name: Start an emulator to keep
        if: ${{ (env.SECTIONS != 'none' || env.PAGES != 'none') && steps.avd-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: playstore
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: echo "Emulator saved for the next builds"
      - name: Capture screenshots
        if: ${{ env.SECTIONS != 'none' || env.PAGES != 'none' }}
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: playstore
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/screenshots/capture.sh
      - name: Store screenshots
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -d shots ] || exit 0
          cd shots
          git init -q
          git add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -q -m "Screenshots ${{ github.run_number }}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/screenshots/latest HEAD:refs/screenshots/build-${{ github.run_number }}
      - name: Refresh the wiki pictures
        if: ${{ steps.release.outputs.released == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -d shots ] || exit 0
          git config user.name bornaradusin
          git config user.email 43745159+bornaradusin@users.noreply.github.com
          grep -v '^#' .github/screenshots/wiki-images.txt | while read -r shot image; do
            if [ -n "$shot" ] && [ -f "shots/$shot.png" ]; then cp "shots/$shot.png" "wiki/images/$image"; fi
          done
          git add wiki/images
          if git diff --cached --quiet; then echo "Wiki pictures unchanged"; exit 0; fi
          git -c user.name=bornaradusin -c user.email=43745159+bornaradusin@users.noreply.github.com \
            commit -q -m "Wiki: pictures from v${{ steps.apk.outputs.version }}"
          git pull -q --rebase origin main
          git push -q origin HEAD:main
          # A push made with this token doesn't start other workflows, so publish the wiki here.
          git clone -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" "$RUNNER_TEMP/wiki-repo"
          rsync -a --delete --exclude .git wiki/ "$RUNNER_TEMP/wiki-repo/"
          cd "$RUNNER_TEMP/wiki-repo"
          git add -A
          git diff --cached --quiet && exit 0
          git -c user.name=bornaradusin -c user.email=43745159+bornaradusin@users.noreply.github.com commit -q -m "Update wiki"
          git push -q
